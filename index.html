<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V T Textiles - Online Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPOp8NtMBP09rNtCGe5-wRre6Y_Zt5g0M",
            authDomain: "venkat-textiles.firebaseapp.com",
            projectId: "venkat-textiles",
            storageBucket: "venkat-textiles.firebasestorage.app",
            messagingSenderId: "636994469508",
            appId: "1:636994469508:web:3635e18d8ee64288be0cd1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];
        let cart = [];
        let selectedCategory = 'ALL';

        window.loadStoreProducts = async function() {
            const container = document.getElementById('store-products-list');
            container.innerHTML = `<p class="text-gray-500 text-center py-6 text-xs col-span-2">ప్రొడక్ట్స్ లోడ్ అవుతున్నాయి...</p>`;

            try {
                const q = query(collection(db, "items"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                allProducts = [];

                querySnapshot.forEach((docSnap) => {
                    allProducts.push({ id: docSnap.id, ...docSnap.data() });
                });

                displayProducts();
            } catch (e) {
                container.innerHTML = `<p class="text-red-500 text-center text-xs col-span-2">లోపం: ${e.message}</p>`;
            }
        };

        window.filterCategory = function(cat, btn) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('bg-rose-600', 'text-white');
                b.classList.add('bg-gray-100', 'text-gray-700');
            });
            btn.classList.remove('bg-gray-100', 'text-gray-700');
            btn.classList.add('bg-rose-600', 'text-white');
            displayProducts();
        };

        function displayProducts() {
            const container = document.getElementById('store-products-list');
            const filtered = selectedCategory === 'ALL' 
                ? allProducts 
                : allProducts.filter(p => (p.catalog || '').toUpperCase() === selectedCategory);

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-8 text-xs col-span-2">ఈ కేటగిరీలో ప్రొడక్ట్స్ ఏవీ లేవు.</p>`;
                return;
            }

            let html = '';
            filtered.forEach(p => {
                const stock = Number(p.stock) || 0;
                const isOut = stock <= 0;
                
                html += `
                    <div class="bg-white rounded-2xl p-2.5 border border-gray-200 shadow-sm flex flex-col justify-between">
                        <div>
                            <img src="${p.image}" class="w-full h-40 object-cover rounded-xl mb-2">
                            <h3 class="font-bold text-xs text-gray-900 truncate">${p.name}</h3>
                            <p class="text-[10px] text-gray-500 line-clamp-1">${p.description || ''}</p>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-rose-600 font-black text-sm">₹${p.price}</span>
                                <span class="text-gray-400 text-[10px] line-through">₹${Math.round(p.price * 1.3)}</span>
                                <span class="bg-rose-50 text-rose-600 text-[9px] font-bold px-1.5 py-0.5 rounded">30% OFF</span>
                            </div>
                        </div>
                        <div class="mt-3">
                            <p class="text-[10px] font-bold ${isOut ? 'text-red-500' : 'text-emerald-600'} mb-1">${isOut ? 'అవుట్ ఆఫ్ స్టాక్' : 'స్టాక్ లో ఉంది'}</p>
                            <button onclick="addToCart('${p.id}')" ${isOut ? 'disabled' : ''} class="w-full ${isOut ? 'bg-gray-300 cursor-not-allowed' : 'bg-rose-600 hover:bg-rose-700'} text-white py-1.5 rounded-lg text-xs font-bold shadow transition">
                                ${isOut ? 'అవుట్ ఆఫ్ స్టాక్' : 'కార్ట్‌కి జోడించు'}
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.addToCart = function(id) {
            const product = allProducts.find(p => p.id === id);
            if (!product) return;

            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
            alert("ప్రొడక్ట్ కార్ట్‌కి జోడించబడింది!");
        };

        function updateCartUI() {
            const countElem = document.getElementById('cart-count');
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            countElem.innerText = totalQty;
        }

        window.openCartModal = function() {
            document.getElementById('cartModal').classList.remove('hidden');
            const container = document.getElementById('cart-items-list');
            
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-6 text-xs">మీ కార్ట్ ఖాళీగా ఉంది.</p>`;
                document.getElementById('cart-total-amount').innerText = "₹0";
                return;
            }

            let html = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price * item.qty;
                html += `
                    <div class="flex justify-between items-center bg-gray-50 p-2 rounded-xl border border-gray-200 text-xs">
                        <div>
                            <h4 class="font-bold text-gray-900">${item.name}</h4>
                            <p class="text-rose-600 font-semibold">₹${item.price} x ${item.qty}</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-600 font-bold text-xs bg-red-50 px-2 py-1 rounded">తొలగించు</button>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('cart-total-amount').innerText = `₹${total}`;
        };

        window.removeFromCart = function(index) {
            cart.splice(index, 1);
            updateCartUI();
            openCartModal();
        };

        window.closeCartModal = function() {
            document.getElementById('cartModal').classList.add('hidden');
        };

        window.openCheckoutModal = function() {
            if (cart.length === 0) {
                alert("కార్ట్ ఖాళీగా ఉంది!");
                return;
            }
            closeCartModal();
            document.getElementById('checkoutModal').classList.remove('hidden');
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('checkout-total').innerText = `₹${total}`;
        };

        window.closeCheckoutModal = function() {
            document.getElementById('checkoutModal').classList.add('hidden');
        };

        window.submitOrder = async function(event) {
            event.preventDefault();
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;
            const pincode = document.getElementById('custPincode').value;
            const utrNumber = document.getElementById('custUtr').value;

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const orderId = 'VT' + Math.floor(100000 + Math.random() * 900000);

            try {
                await addDoc(collection(db, "orders"), {
                    orderId,
                    name,
                    phone,
                    address,
                    pincode,
                    utrNumber,
                    items: cart,
                    total,
                    timestamp: new Date().toISOString()
                });

                alert("మీ ఆర్డర్ విజయవంతంగా సమర్పించబడింది! ఆర్డర్ ఐడీ: " + orderId);
                cart = [];
                updateCartUI();
                closeCheckoutModal();
                document.getElementById('checkoutForm').reset();
            } catch(e) {
                alert("ఆర్డర్ సబ్మిట్ చేయడంలో లోపం: " + e.message);
            }
        };

        window.onload = function() {
            loadStoreProducts();
        };
    </script>
</head>
<body class="bg-gray-100 pb-16">
    <header class="bg-gray-900 text-white p-3 sticky top-0 z-40 shadow flex justify-between items-center">
        <h1 class="text-sm font-black tracking-wide">V T TEXTILES</h1>
        <div class="flex gap-2">
            <button onclick="openCartModal()" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow flex items-center gap-1">
                🛒 కార్ట్ (<span id="cart-count">0</span>)
            </button>
            <button onclick="window.location.href='admin.html'" class="bg-gray-800 hover:bg-gray-700 text-white px-2 py-1.5 rounded-lg text-xs font-bold">అడ్మిన్</button>
        </div>
    </header>

    <main class="container mx-auto p-3 max-w-xl space-y-4">
        <!-- Categories Filter -->
        <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
            <button onclick="filterCategory('ALL', this)" class="cat-btn bg-rose-600 text-white px-3 py-1.5 rounded-full font-bold whitespace-nowrap shadow-sm">అన్నీ (All)</button>
            <button onclick="filterCategory('SILK SAREES', this)" class="cat-btn bg-gray-100 text-gray-700 px-3 py-1.5 rounded-full font-bold whitespace-nowrap shadow-sm">Silk Sarees</button>
            <button onclick="filterCategory('PATTU SAREES', this)" class="cat-btn bg-gray-100 text-gray-700 px-3 py-1.5 rounded-full font-bold whitespace-nowrap shadow-sm">Pattu Sarees</button>
            <button onclick="filterCategory('WORK SAREES', this)" class="cat-btn bg-gray-100 text-gray-700 px-3 py-1.5 rounded-full font-bold whitespace-nowrap shadow-sm">Work Sarees</button>
            <button onclick="filterCategory('COTTON SAREES', this)" class="cat-btn bg-gray-100 text-gray-700 px-3 py-1.5 rounded-full font-bold whitespace-nowrap shadow-sm">Cotton Sarees</button>
            <button onclick="filterCategory('FANCY SAREES', this)" class="cat-btn bg-gray-100 text-gray-700 px-3 py-1.5 rounded-full font-bold whitespace-nowrap shadow-sm">Fancy Sarees</button>
            <button onclick="filterCategory('READYMADE', this)" class="cat-btn bg-gray-100 text-gray-700 px-3 py-1.5 rounded-full font-bold whitespace-nowrap shadow-sm">Readymade</button>
        </div>

        <!-- Products Grid -->
        <section>
            <div id="store-products-list" class="grid grid-cols-2 gap-3"></div>
        </section>
    </main>

    <!-- Cart Modal -->
    <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-70 hidden z-50 flex items-center justify-center p-3">
        <div class="bg-white w-full max-w-md p-4 rounded-2xl relative max-h-[85vh] flex flex-col shadow-xl">
            <div class="flex justify-between items-center border-b pb-2 mb-3">
                <h3 class="text-sm font-black text-gray-900">🛒 మీ కార్ట్</h3>
                <button onclick="closeCartModal()" class="text-gray-500 font-bold text-base hover:text-red-600">✕</button>
            </div>
            <div id="cart-items-list" class="flex-grow overflow-y-auto space-y-2 pr-1"></div>
            <div class="border-t pt-3 mt-3 flex justify-between items-center font-bold text-sm">
                <span>మొత్తం (Total):</span>
                <span id="cart-total-amount" class="text-rose-600">₹0</span>
            </div>
            <button onclick="openCheckoutModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl text-xs font-bold shadow mt-3 transition">ఆర్డర్ చేయండి (Checkout)</button>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="fixed inset-0 bg-black bg-opacity-70 hidden z-50 flex items-center justify-center p-3">
        <div class="bg-white w-full max-w-md p-4 rounded-2xl relative max-h-[90vh] overflow-y-auto shadow-xl">
            <div class="flex justify-between items-center border-b pb-2 mb-3">
                <h3 class="text-sm font-black text-gray-900">📋 షిప్పింగ్ & పేమెంట్ వివరాలు</h3>
                <button onclick="closeCheckoutModal()" class="text-gray-500 font-bold text-base hover:text-red-600">✕</button>
            </div>
            
            <div class="bg-rose-50 border border-rose-200 p-3 rounded-xl mb-3 text-xs">
                <p class="font-bold text-rose-800">మొత్తం చెల్లించవలసిన అమౌంట్: <span id="checkout-total">₹0</span></p>
                <p class="text-[10px] text-gray-600 mt-1">దయచేసి కింద ఉన్న UPI ఐడీకి అమౌంట్ పంపి, ఆ UTR నంబర్‌ని కింద ఎంటర్ చేయండి:</p>
                <p class="font-black text-gray-900 mt-1">UPI ID: <span class="text-rose-700">8121911438@okbizaxis</span></p>
            </div>

            <form id="checkoutForm" onsubmit="submitOrder(event)" class="space-y-2.5 text-xs">
                <div>
                    <label class="font-semibold text-gray-600 block">మీ పూర్తి పేరు:</label>
                    <input type="text" id="custName" required class="w-full border px-2.5 py-1.5 rounded-lg bg-gray-50">
                </div>
                <div>
                    <label class="font-semibold text-gray-600 block">ఫోన్ నంబర్:</label>
                    <input type="tel" id="custPhone" required class="w-full border px-2.5 py-1.5 rounded-lg bg-gray-50">
                </div>
                <div>
                    <label class="font-semibold text-gray-600 block">పూర్తి అడ్రస్ (Address):</label>
                    <textarea id="custAddress" required rows="2" class="w-full border px-2.5 py-1.5 rounded-lg bg-gray-50"></textarea>
                </div>
                <div>
                    <label class="font-semibold text-gray-600 block">పిన్‌కోడ్ (Pincode):</label>
                    <input type="text" id="custPincode" required class="w-full border px-2.5 py-1.5 rounded-lg bg-gray-50">
                </div>
                <div>
                    <label class="font-semibold text-gray-600 block">గూగుల్‌పే/ఫోన్‌పే UTR నంబర్ (12 Digits):</label>
                    <input type="text" id="custUtr" required placeholder="ఉదా: 4321XXXXXXXX" class="w-full border px-2.5 py-1.5 rounded-lg bg-gray-50 font-bold">
                </div>
                <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white py-2 rounded-xl font-bold shadow transition mt-2">ఆర్డర్ కన్ఫర్మ్ చేయి</button>
            </form>
        </div>
    </div>
</body>
</html>
