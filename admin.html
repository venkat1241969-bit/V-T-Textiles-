<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V T Textiles - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPOp8NtMBP09rNtCGe5-wRre6Y_Zt5g0M",
            authDomain: "venkat-textiles.firebaseapp.com",
            projectId: "venkat-textiles",
            storageBucket: "venkat-textiles.appspot.com",
            messagingSenderId: "636994469508",
            appId: "1:636994469508:web:3635e18d8ee64288be0cd1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.addProduct = async function(event) {
            event.preventDefault();
            
            const name = document.getElementById('prodName').value;
            const catalog = document.getElementById('prodCatalog').value;
            const price = document.getElementById('prodPrice').value;
            const discount = document.getElementById('prodDiscount').value;
            const stock = document.getElementById('prodStock').value;
            const desc = document.getElementById('prodDesc').value;
            
            const imageFile = document.getElementById('prodImageFile').files[0];
            const videoFile = document.getElementById('prodVideoFile').files[0];

            if (!imageFile) {
                alert("దయచేసి గ్యాలరీ నుండి ఒక ఫోటోను ఎంచుకోండి!");
                return;
            }

            const btn = document.getElementById('saveBtn');
            btn.innerText = "ఫైల్స్ అప్‌లోడ్ అవుతున్నాయి...";
            btn.disabled = true;

            try {
                // 1. Image Upload to Firebase Storage
                const imgRef = ref(storage, `products/images/${Date.now()}_${imageFile.name}`);
                await uploadBytes(imgRef, imageFile);
                const imageUrl = await getDownloadURL(imgRef);

                // 2. Video Upload to Firebase Storage (Optional)
                let videoUrl = "";
                if (videoFile) {
                    const vidRef = ref(storage, `products/videos/${Date.now()}_${videoFile.name}`);
                    await uploadBytes(vidRef, videoFile);
                    videoUrl = await getDownloadURL(vidRef);
                }

                // 3. Save to Firestore
                await addDoc(collection(db, "items"), {
                    name,
                    catalog,
                    price: Number(price),
                    discount: Number(discount) || 30,
                    stock: Number(stock) || 1,
                    image: imageUrl,
                    video: videoUrl,
                    description: desc,
                    status: Number(stock) > 0 ? "In Stock" : "Out of Stock",
                    timestamp: new Date().toISOString()
                });

                alert("ప్రొడక్ట్ విజయవంతంగా జోడించబడింది!");
                document.getElementById('productForm').reset();
                loadAdminProducts();
            } catch (e) {
                console.error("Error adding product: ", e);
                alert("లోపం ఏర్పడింది: " + e.message);
            } finally {
                btn.innerText = "ప్రొడక్ట్ సేవ్ చేయి";
                btn.disabled = false;
            }
        };

        window.loadAdminProducts = async function() {
            const list = document.getElementById('admin-products-list');
            try {
                const q = query(collection(db, "items"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                let content = '';

                if (querySnapshot.empty) {
                    list.innerHTML = `<p class="text-gray-500 text-center py-6 text-xs">ప్రొడక్ట్స్ ఏవీ లేవు.</p>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const p = docSnap.data();
                    const id = docSnap.id;
                    const stockVal = Number(p.stock) || 0;
                    
                    content += `
                        <div class="bg-white p-2.5 rounded-xl border border-gray-200 flex items-center justify-between gap-2 shadow-sm">
                            <img src="${p.image}" class="w-12 h-12 object-cover rounded-lg">
                            <div class="flex-grow">
                                <h4 class="font-bold text-xs text-gray-900 truncate max-w-[130px]">${p.name}</h4>
                                <p class="text-[10px] text-rose-600 font-black">₹${p.price} | Stock: ${stockVal}</p>
                            </div>
                            <button onclick="deleteProduct('${id}')" class="bg-red-50 text-red-600 border border-red-200 px-2 py-1 rounded-lg text-[10px] font-bold">డిలీట్</button>
                        </div>
                    `;
                });
                list.innerHTML = content;
            } catch (e) {
                list.innerHTML = `<p class="text-red-500 text-center text-xs">లోడ్ అవ్వలేదు</p>`;
            }
        };

        window.deleteProduct = async function(id) {
            if(confirm("ఈ ప్రొడక్ట్‌ని డిలీట్ చేయాలనుకుంటున్నారా?")) {
                await deleteDoc(doc(db, "items", id));
                loadAdminProducts();
            }
        };

        window.onload = function() { loadAdminProducts(); };
    </script>
</head>
<body class="bg-gray-100 pb-16">
    <header class="bg-gray-900 text-white p-3 sticky top-0 z-40 shadow flex justify-between items-center">
        <h1 class="text-sm font-black tracking-wide">V T TEXTILES ADMIN</h1>
        <a href="index.html" class="bg-rose-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">స్టోర్</a>
    </header>

    <main class="container mx-auto p-3 max-w-xl space-y-4">
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
            <h2 class="text-xs font-bold text-gray-800 mb-3 uppercase tracking-wider border-b pb-1">➕ కొత్త ప్రొడక్ట్ జోడించండి</h2>
            <form id="productForm" onsubmit="addProduct(event)" class="space-y-2.5">
                <div>
                    <label class="text-[10px] font-semibold text-gray-600 block">ప్రొడక్ట్ పేరు:</label>
                    <input type="text" id="prodName" required placeholder="ఉదా: పట్టు చీర" class="w-full border px-2.5 py-1.5 text-xs rounded-lg outline-none bg-gray-50">
                </div>
                <div>
                    <label class="text-[10px] font-semibold text-gray-600 block">కేటగిరీ ఎంచుకోండి:</label>
                    <select id="prodCatalog" class="w-full border px-2.5 py-1.5 text-xs rounded-lg outline-none bg-gray-50 font-bold">
                        <option value="SILK SAREES">SILK SAREES</option>
                        <option value="PATTU SAREES">PATTU SAREES</option>
                        <option value="WORK SAREES">WORK SAREES</option>
                        <option value="COTTON SAREES">COTTON SAREES</option>
                        <option value="FANCY SAREES">FANCY SAREES</option>
                        <option value="READYMADE">READYMADE</option>
                    </select>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="text-[10px] font-semibold text-gray-600 block">ధర (₹):</label>
                        <input type="number" id="prodPrice" required placeholder="450" class="w-full border px-2.5 py-1.5 text-xs rounded-lg outline-none bg-gray-50">
                    </div>
                    <div>
                        <label class="text-[10px] font-semibold text-gray-600 block">డిస్కౌంట్ (%):</label>
                        <input type="number" id="prodDiscount" value="30" class="w-full border px-2.5 py-1.5 text-xs rounded-lg outline-none bg-gray-50">
                    </div>
                    <div>
                        <label class="text-[10px] font-semibold text-gray-600 block">స్టాక్:</label>
                        <input type="number" id="prodStock" required placeholder="10" class="w-full border px-2.5 py-1.5 text-xs rounded-lg outline-none bg-gray-50">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-semibold text-gray-600 block">ఫోటో ఎంచుకోండి:</label>
                    <input type="file" id="prodImageFile" accept="image/*" required class="w-full border px-2.5 py-1.5 text-xs rounded-lg bg-gray-50">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-700 block mb-1">ప్రొడక్ట్ వీడియో (Optional):</label>
                    <input type="file" id="prodVideoFile" accept="video/*" class="w-full border px-2.5 py-1.5 text-xs rounded-lg bg-gray-50">
                </div>
                <div>
                    <label class="text-[10px] font-semibold text-gray-600 block">వివరణ:</label>
                    <input type="text" id="prodDesc" placeholder="డీప్ కల్ర్స్" class="w-full border px-2.5 py-1.5 text-xs rounded-lg outline-none bg-gray-50">
                </div>
                <button type="submit" id="saveBtn" class="w-full bg-rose-600 text-white py-2 rounded-lg text-xs font-bold shadow">ప్రొడక్ట్ సేవ్ చేయి</button>
            </form>
        </section>
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
            <h2 class="text-xs font-bold text-gray-800 mb-3 uppercase tracking-wider border-b pb-1">📦 ప్రొడక్ట్స్ జాబితా</h2>
            <div id="admin-products-list" class="space-y-3"></div>
        </section>
    </main>
</body>
</html>
